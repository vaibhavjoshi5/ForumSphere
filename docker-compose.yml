services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-forumsphere}
      MYSQL_USER: ${MYSQL_USER:-forumsphere}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-forumsphere}
      MYSQL_USER: ${MYSQL_USER:-forumsphere}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      SECRET: ${SECRET:?Set SECRET}
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
  nginx:
    image: nginx
    depends_on: [backend, frontend]
    ports: ["8080:8080"]
    volumes:
      - ./nginx/local.conf:/etc/nginx/nginx.conf:ro
volumes:
  mysql_data:
